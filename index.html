<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Telemetry</title>
<style>
  :root {
    --bg: #f7f8f6; --surface: #ffffff; --text: #1d2521; --muted: #5d6b64;
    --line: #d9dfdb; --accent: #1f6f5b; --bad: #b3402a; --ok: #1f6f5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17; --surface: #1c2420; --text: #e6ece8; --muted: #96a59d;
      --line: #2c3731; --accent: #5cc4a6; --bad: #e07a63; --ok: #5cc4a6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .status { color: var(--muted); margin: 0 0 24px; }
  .status b { color: var(--bad); }
  .status.live b { color: var(--ok); }
  .latest { display: flex; gap: 32px; margin-bottom: 24px; }
  .latest div { background: var(--surface); border: 1px solid var(--line);
                border-radius: 6px; padding: 12px 20px; }
  .latest span { display: block; color: var(--muted); font-size: .85rem; }
  .latest strong { font-size: 1.8rem; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--accent); background: var(--accent); color: var(--bg); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--surface);
          border: 1px solid var(--line); }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); padding: 16px 12px; }
</style>
</head>
<body>
<main>
  <h1>ESP32 telemetry</h1>
  <p id="status" class="status"><b>Connecting…</b></p>

  <div class="latest">
    <div><span>Temperature (°C)</span><strong id="temp">–</strong></div>
    <div><span>Humidity (%)</span><strong id="hum">–</strong></div>
  </div>

  <div class="bar">
    <h2 style="font-size:1.1rem;margin:0">Readings</h2>
    <button id="export">Export CSV</button>
  </div>
  <div class="wrap">
    <table>
      <thead><tr><th>Time</th><th>Temp (°C)</th><th>Humidity (%)</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">Waiting for the first reading from the ESP32.</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  // ---- Settings: change these to match your ESP32 code ----
  const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
  const TOPIC = "diddy-esp32/telemetry";   // use "diddy-esp32/+/telemetry" later for many boards
  // ---------------------------------------------------------

  const readings = [];   // kept in memory while the page is open
  const statusEl = document.getElementById("status");
  const rowsEl = document.getElementById("rows");

  function setStatus(text, live) {
    statusEl.className = "status" + (live ? " live" : "");
    statusEl.innerHTML = "<b>" + text + "</b>";
  }

  // The client ID must be different from the one the ESP32 uses.
  const client = mqtt.connect(BROKER_URL, {
    clientId: "web-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000
  });

  client.on("connect", () => {
    setStatus("Connected to HiveMQ, waiting for data on " + TOPIC, true);
    client.subscribe(TOPIC);
  });
  client.on("reconnect", () => setStatus("Reconnecting…", false));
  client.on("offline", () => setStatus("Offline", false));
  client.on("error", (e) => setStatus("Error: " + e.message, false));

  client.on("message", (topic, payload) => {
    let data;
    try { data = JSON.parse(payload.toString()); }
    catch (e) { return; }                      // ignore anything that isn't JSON
    const row = { time: new Date(), temp: data.temp_c, hum: data.humidity };
    readings.push(row);
    render(row);
  });

  function render(row) {
    document.getElementById("empty").style.display = "none";
    document.getElementById("temp").textContent = row.temp ?? "–";
    document.getElementById("hum").textContent = row.hum ?? "–";
    const tr = document.createElement("tr");
    [row.time.toLocaleTimeString(), row.temp, row.hum].forEach((v) => {
      const td = document.createElement("td");
      td.textContent = v ?? "";
      tr.appendChild(td);
    });
    rowsEl.prepend(tr);                        // newest first
  }

  document.getElementById("export").addEventListener("click", () => {
    if (!readings.length) return;
    const lines = ["time,temp_c,humidity"].concat(
      readings.map((r) => [r.time.toISOString(), r.temp, r.hum].join(","))
    );
    const blob = new Blob([lines.join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "esp32-readings.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });
</script>
</body>
</html>
